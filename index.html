<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Strength Coach V2</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header><h1>Strength Coach</h1><p>3-day home strength program</p></header><main><section class="profile"><label>Body weight (kg)<input id="bodyWeight" type="number" inputmode="decimal" step="0.1" placeholder="71"></label><button id="saveWeight">Save weight</button><span id="weightStatus"></span></section><nav id="tabs"><button data-tab="workout" class="active">Workout</button><button data-tab="history">History</button><button data-tab="settings">Data</button></nav><section id="workout" class="panel active"><div class="day-picker"><button data-day="A" class="active">A</button><button data-day="B">B</button><button data-day="C">C</button></div><div id="exerciseList"></div><label class="notes">Workout notes<textarea id="workoutNotes" placeholder="Energy, discomfort, substitutions..."></textarea></label><button class="primary" id="saveWorkout">Save completed workout</button><p id="saveStatus"></p></section><section id="history" class="panel"><h2>Workout history</h2><div id="historyList"></div></section><section id="settings" class="panel"><h2>Your data</h2><p>Records are saved only in this browser on this device.</p><button id="exportData">Export backup</button><button class="danger" id="clearData">Delete all saved data</button></section></main><script src="script.js"></script></body></html>
